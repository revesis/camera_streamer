<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realme Camera Ultra-Low Latency Live Stream</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(26, 34, 53, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px;
        }

        header {
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            backdrop-filter: blur(12px);
        }

        .title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-box h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .device-badge {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(96, 165, 250, 0.25);
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        main {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 520px;
        }

        .video-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
            transition: transform 0.2s ease;
        }

        canvas#stream-canvas, img#mjpeg-stream {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            border-radius: 6px;
            user-select: none;
        }

        .focus-ring {
            position: absolute;
            width: 44px;
            height: 44px;
            border: 2px solid #38bdf8;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(1.6);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.2s ease;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .focus-ring.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .latency-indicator {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 8px;
        }

        .latency-val {
            color: #38bdf8;
            font-weight: 600;
        }

        .controls-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(12px);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        .info-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-sub);
            padding: 2px 8px;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 9px 18px;
            border-radius: 24px;
            border: 1px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <div class="title-box">
            <h1>Realme Live Camera</h1>
            <span class="device-badge">Ultra-Low Latency Mode</span>
        </div>
        <div class="status-box">
            <div class="status-badge">
                <div class="pulse-dot" id="live-dot"></div>
                <span id="conn-state">WebSocket Direct</span>
            </div>
        </div>
    </header>

    <main>
        <div class="player-wrapper" id="player-box">
            <div class="latency-indicator">
                <span>Latency: <span class="latency-val">&lt; 50ms</span></span>
                <span>Frame Rate: <span class="latency-val" id="fps-counter">30.0 FPS</span></span>
            </div>

            <div class="video-container" id="video-container">
                <canvas id="stream-canvas" width="540" height="720"></canvas>
                <img id="mjpeg-stream" style="display:none;" />
                <div class="focus-ring" id="focus-ring"></div>
            </div>
        </div>

        <div class="controls-card">
            <div class="btn-group">
                <button class="primary" id="btn-switch">
                    🔄 Switch Camera
                </button>
                <button id="btn-snapshot">
                    📸 Capture Snapshot
                </button>
                <button id="btn-wake">
                    ⚡ Wake / Re-open Camera
                </button>
                <button id="btn-rotate">
                    📐 Rotate
                </button>
                <button id="btn-fullscreen">
                    ⛶ Fullscreen
                </button>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-sub);">
                💡 Click anywhere on the video feed to focus
            </div>
        </div>

        <div class="info-bar">
            <span>Protocol: WebSocket Canvas (Zero-buffer Real-time Render)</span>
            <span>Pipeline: Hardware Crop H.264 &rarr; 30fps MJPEG Kernel Feed</span>
            <span>Watchdog: Active Guard</span>
        </div>
    </main>

    <div class="toast" id="toast">Action triggered</div>

    <script>
        const canvas = document.getElementById('stream-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('video-container');
        const focusRing = document.getElementById('focus-ring');
        const toastEl = document.getElementById('toast');
        const fpsEl = document.getElementById('fps-counter');
        const connStateEl = document.getElementById('conn-state');
        const liveDot = document.getElementById('live-dot');

        let rotation = 0;
        let ws = null;
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        let isDecoding = false;
        let pendingBlob = null;

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1800);
        }

        // Establish zero-latency WebSocket connection
        function connectWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${proto}//${location.host}/ws`;
            ws = new WebSocket(wsUrl);
            ws.binaryType = 'blob';

            ws.onopen = () => {
                connStateEl.textContent = "Live Connected";
                connStateEl.style.color = "#10b981";
                liveDot.style.background = "#10b981";
            };

            ws.onmessage = (event) => {
                pendingBlob = event.data;
                if (!isDecoding) {
                    processNextFrame();
                }
            };

            ws.onclose = () => {
                connStateEl.textContent = "Reconnecting...";
                connStateEl.style.color = "#f59e0b";
                liveDot.style.background = "#f59e0b";
                setTimeout(connectWebSocket, 1500);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        async function processNextFrame() {
            if (!pendingBlob) return;
            isDecoding = true;
            const blob = pendingBlob;
            pendingBlob = null;
            try {
                const bmp = await createImageBitmap(blob);
                if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
                    canvas.width = bmp.width;
                    canvas.height = bmp.height;
                }
                ctx.drawImage(bmp, 0, 0);
                bmp.close();

                frameCount++;
                const now = performance.now();
                if (now - lastFpsUpdate >= 1000) {
                    const currentFps = (frameCount / ((now - lastFpsUpdate) / 1000)).toFixed(1);
                    fpsEl.textContent = `${currentFps} FPS`;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }
            } catch (e) {
                console.error("Frame decode error:", e);
            } finally {
                isDecoding = false;
                if (pendingBlob) {
                    requestAnimationFrame(processNextFrame);
                }
            }
        }

        connectWebSocket();

        // Tap to focus on canvas
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const relX = (x / rect.width).toFixed(3);
            const relY = (y / rect.height).toFixed(3);

            focusRing.style.left = `${x}px`;
            focusRing.style.top = `${y}px`;
            focusRing.classList.remove('active');
            void focusRing.offsetWidth;
            focusRing.classList.add('active');

            fetch('/api/focus', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({rel_x: parseFloat(relX), rel_y: parseFloat(relY)})
            }).then(() => showToast(`Focused at (${Math.round(relX*100)}%, ${Math.round(relY*100)}%)`))
              .catch(e => console.error(e));
        });

        // Switch camera
        document.getElementById('btn-switch').addEventListener('click', () => {
            showToast('Switching camera...');
            fetch('/api/switch_camera', {method: 'POST'})
                .then(() => showToast('Camera switched'))
                .catch(() => showToast('Switch failed'));
        });

        // Instant snapshot (no interruption to camera preview)
        document.getElementById('btn-snapshot').addEventListener('click', () => {
            canvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `realme_snapshot_${Date.now()}.jpg`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Snapshot saved');
            }, 'image/jpeg', 0.95);
        });

        // Wake / relaunch camera
        document.getElementById('btn-wake').addEventListener('click', () => {
            showToast('Activating camera interface...');
            fetch('/api/wake', {method: 'POST'})
                .then(() => showToast('Camera activated'));
        });

        // Rotate video
        document.getElementById('btn-rotate').addEventListener('click', () => {
            rotation = (rotation + 90) % 360;
            container.style.transform = `rotate(${rotation}deg)`;
            showToast(`Rotated to ${rotation}°`);
        });

        // Fullscreen
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            const box = document.getElementById('player-box');
            if (!document.fullscreenElement) {
                box.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
